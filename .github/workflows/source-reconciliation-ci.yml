name: Source reconciliation staging contract

on:
  pull_request:
    paths:
      - "sources/**"
      - "pipeline/source-reconciliation/**"
      - "pipeline/historical-v1-identity-proposals.jsonl"
      - "scripts/reconcile_source_relations.py"
      - "scripts/stage_source_reconciliation.py"
      - "scripts/review_source_concept.py"
      - "database/migrations/0002_source_reconciliation_staging.sql"
      - "tests/test_source_reconciliation.py"
      - "tests/test_source_staging.py"
      - ".github/workflows/source-reconciliation-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-review-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: source_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: source_review_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source_ci -d source_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://source_ci:disposable-ci-only@127.0.0.1:5432/source_review_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild source reconciliation and verify pinned output
        run: |
          python scripts/reconcile_source_relations.py > /tmp/reconciliation-manifest.json
          git diff --exit-code -- pipeline/source-reconciliation
          python scripts/validate_v2.py
          python -m pytest -q tests/test_source_reconciliation.py tests/test_source_staging.py
      - name: Install isolated source staging schema
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f database/migrations/0002_source_reconciliation_staging.sql
      - name: Reconcile, stage, verify and repeat idempotently
        run: |
          python scripts/stage_source_reconciliation.py plan
          python scripts/stage_source_reconciliation.py apply --confirm-staging STAGE-UNREVIEWED-SOURCES
          python scripts/stage_source_reconciliation.py verify
          python scripts/stage_source_reconciliation.py apply --confirm-staging STAGE-UNREVIEWED-SOURCES
          python scripts/stage_source_reconciliation.py verify
          test "$(psql "$DATABASE_URL" -XAtc "select to_regclass('knowledge.statement') is null")" = t
          test "$(psql "$DATABASE_URL" -XAtc "select count(*) from knowledge_source.assertion where inference_eligible")" = 0
