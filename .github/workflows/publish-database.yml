name: Publish canonical data to PostgreSQL

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan, apply, or verify canonical Git state against the production runtime
        required: true
        type: choice
        default: plan
        options:
          - plan
          - verify
          - apply

permissions:
  contents: read

concurrency:
  group: production-database-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-database
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Require production database credential
        run: test -n "$DATABASE_URL" || { echo "DATABASE_URL is not configured in the production-database environment"; exit 1; }

      - name: Validate canonical repository state
        run: |
          python scripts/validate_v2.py
          pytest -q

      - name: Plan publication
        if: inputs.mode == 'plan'
        run: python scripts/publish.py plan

      - name: Verify runtime
        if: inputs.mode == 'verify'
        run: python scripts/publish.py verify

      - name: Require main for apply
        if: inputs.mode == 'apply' && github.ref_name != 'main'
        run: |
          echo "Production apply is allowed only from main."
          exit 1

      - name: Publish canonical main
        if: inputs.mode == 'apply' && github.ref_name == 'main'
        run: python scripts/publish.py apply --confirm-publish PUBLISH

      - name: Verify published runtime
        if: inputs.mode == 'apply' && github.ref_name == 'main'
        run: python scripts/publish.py verify
